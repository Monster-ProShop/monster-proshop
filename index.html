<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSV Pro - Bowler Specs Vault</title>
    
    <meta name="theme-color" content="#0B0F19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" id="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F19', // Deep Midnight Navy
                        card: '#1E293B',
                        primary: '#38BDF8', // Cobalt Blue
                        primaryHover: '#2563EB'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        .pitch-input { width: 100%; background-color: #111827; border: 1px solid #374151; border-radius: 4px; padding: 8px; color: white; font-size: 0.875rem; outline: none; }
        .pitch-input:focus { border-color: #38BDF8; }
        .dir-select { background-color: #1f2937; color: white; border: 1px solid #374151; border-radius: 4px; padding: 8px; font-size: 0.875rem; outline: none; }
        .dir-select:focus { border-color: #38BDF8; }
    </style>
</head>
<body class="bg-dark text-gray-200 font-sans antialiased pb-20">

    <!-- Header with Integrated Logo Concept 2 -->
    <header class="bg-card border-b border-gray-800 sticky top-0 z-40 px-4 py-3 shadow-lg flex justify-between items-center">
        <!-- SVG Logo: Core Vault Sphere -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 350 120" class="h-10 w-auto">
            <defs>
                <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38BDF8" />
                    <stop offset="100%" stop-color="#2563EB" />
                </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#1E293B" stroke-width="3"/>
            <path d="M 35 40 C 50 35 65 42 60 55 C 55 68 35 65 35 80 C 35 90 50 90 60 85" fill="none" stroke="url(#cobaltGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 60 40 L 75 85 L 90 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="45" cy="30" r="4.5" fill="#38BDF8" />
            <circle cx="62" cy="25" r="4.5" fill="#38BDF8" />
            <circle cx="50" cy="50" r="5.5" fill="#38BDF8" />
            
            <text x="130" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">BSV</text>
            <rect x="235" y="46" width="60" height="34" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <text x="246" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#38BDF8">PRO</text>
            <text x="132" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#64748B">BOWLER SPECS VAULT</text>
        </svg>

        <button onclick="openForm()" class="bg-primary hover:bg-primaryHover text-white px-3 py-1.5 rounded text-sm font-bold shadow-md transition">+ NEW</button>
    </header>

    <main class="p-4 w-full max-w-lg mx-auto" id="mainView">
        <div id="bowlerList" class="space-y-3"></div>
        <div id="emptyState" class="hidden flex flex-col items-center justify-center mt-20 text-center opacity-50">
            <svg class="w-16 h-16 mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <p>No bowlers found.<br>Tap + NEW to create a profile.</p>
        </div>
    </main>

    <!-- Bowler Form / Detail Modal -->
    <div id="formModal" class="fixed inset-0 bg-dark z-50 hidden overflow-y-auto w-full max-w-lg mx-auto">
        <div class="sticky top-0 bg-card border-b border-gray-800 px-4 py-4 flex justify-between items-center z-10">
            <h2 id="formTitle" class="text-lg font-bold text-white">Bowler Profile</h2>
            <button onclick="closeForm()" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
        </div>

        <form id="bowlerForm" onsubmit="saveBowler(event)" class="p-4 space-y-5">
            <input type="hidden" id="bowlerId">

            <!-- Profile Identity & Style -->
            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-4">
                <div class="flex items-center gap-4">
                    <!-- Profile Picture Upload -->
                    <div class="relative w-16 h-16 rounded-full bg-gray-900 border border-gray-700 flex items-center justify-center overflow-hidden shrink-0 cursor-pointer" onclick="document.getElementById('profilePhotoInput').click()">
                        <img id="profilePreview" class="w-full h-full object-cover hidden">
                        <span id="profileIcon" class="text-2xl text-gray-500">📷</span>
                    </div>
                    <input type="file" id="profilePhotoInput" accept="image/*" class="hidden" onchange="handleFile(event, 'profile')">
                    <input type="hidden" id="profilePhotoData">
                    
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-primary mb-1 uppercase">Bowler Name</label>
                        <input type="text" id="bName" required class="pitch-input text-lg font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-primary mb-1 uppercase">Bowling Style</label>
                    <select id="bowlerStyle" class="pitch-input font-semibold text-primary" onchange="toggleThumbSections()">
                        <option value="right">Right Handed (1-Hand)</option>
                        <option value="left">Left Handed (1-Hand)</option>
                        <option value="no_thumb">No Thumb (2-Handed)</option>
                    </select>
                </div>
            </div>

            <!-- Stats & PAP -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-card p-3 rounded-lg border border-gray-800">
                    <label class="block text-xs font-bold text-primary mb-2 uppercase">PAP</label>
                    <div class="flex gap-1 mb-2">
                        <input type="text" id="papX" placeholder="Dist" class="pitch-input">
                        <select id="papXDir" class="dir-select px-1"><option value="→">→ R</option><option value="←">← L</option></select>
                    </div>
                    <div class="flex gap-1">
                        <input type="text" id="papY" placeholder="Dist" class="pitch-input">
                        <select id="papYDir" class="dir-select px-1"><option value="↑">↑ Up</option><option value="↓">↓ Dn</option></select>
                    </div>
                </div>
                
                <div class="bg-card p-3 rounded-lg border border-gray-800">
                    <label class="block text-xs font-bold text-primary mb-2 uppercase">Stats</label>
                    <div class="grid grid-cols-1 gap-2">
                        <input type="text" id="statRevs" placeholder="Revs (RPM)" class="pitch-input">
                        <input type="number" id="statAvg" placeholder="Average" class="pitch-input">
                        <input type="number" id="statSpeed" placeholder="Speed (MPH)" step="0.1" class="pitch-input">
                    </div>
                </div>
            </div>

            <!-- Drill Sheet Area -->
            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-4">
                <label class="block text-xs font-bold text-primary uppercase border-b border-gray-700 pb-2">Drill Sheet / Pitches</label>
                
                <!-- Spans & Auto-Pitch Suggester (Hidden if No Thumb) -->
                <div id="spanSection" class="space-y-2 pb-2 border-b border-gray-800">
                    <span class="text-xs font-bold text-gray-400 block">Spans</span>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="spanLeft" placeholder="Left Span" class="pitch-input text-center">
                        <input type="text" id="spanRight" placeholder="Right Span" class="pitch-input text-center">
                    </div>
                    
                    <div class="flex gap-2 items-center bg-gray-900 p-2 rounded border border-gray-700 mt-2">
                        <select id="thumbSize" class="dir-select flex-1 text-xs">
                            <option value="normal">Normal Thumb</option>
                            <option value="small">Small Thumb (+1/8 FWD)</option>
                            <option value="large">Large Thumb (+1/8 REV)</option>
                        </select>
                        <button type="button" onclick="suggestThumbPitch()" class="bg-primary hover:bg-primaryHover text-dark px-3 py-2 rounded text-xs font-bold transition">Auto-Pitch</button>
                    </div>
                </div>

                <!-- Left Finger -->
                <div class="bg-gray-900 p-2 rounded border border-gray-700">
                    <span class="text-xs font-bold text-gray-400 block mb-1">Left Finger</span>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="lfP1" placeholder="Pitch" class="pitch-input">
                        <select id="lfD1" class="dir-select"><option value="↑">↑ Up (FWD)</option><option value="↓">↓ Down (REV)</option></select>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="lfP2" placeholder="Pitch" class="pitch-input">
                        <select id="lfD2" class="dir-select"><option value="←">← Left</option><option value="→">→ Right</option></select>
                    </div>
                </div>

                <!-- Right Finger -->
                <div class="bg-gray-900 p-2 rounded border border-gray-700">
                    <span class="text-xs font-bold text-gray-400 block mb-1">Right Finger</span>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="rfP1" placeholder="Pitch" class="pitch-input">
                        <select id="rfD1" class="dir-select"><option value="↑">↑ Up (FWD)</option><option value="↓">↓ Down (REV)</option></select>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="rfP2" placeholder="Pitch" class="pitch-input">
                        <select id="rfD2" class="dir-select"><option value="←">← Left</option><option value="→">→ Right</option></select>
                    </div>
                </div>

                <!-- Thumb Features (Hidden if No Thumb) -->
                <div id="thumbFeaturesSection" class="space-y-4">
                    <!-- Thumb -->
                    <div class="bg-gray-900 p-2 rounded border border-gray-700">
                        <span class="text-xs font-bold text-primary block mb-1">Thumb</span>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="thP1" placeholder="Pitch" class="pitch-input border-primary">
                            <select id="thD1" class="dir-select"><option value="↑">↑ Up (FWD)</option><option value="↓">↓ Down (REV)</option></select>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="thP2" placeholder="Pitch" class="pitch-input border-primary">
                            <select id="thD2" class="dir-select"><option value="←">← Left</option><option value="→">→ Right</option></select>
                        </div>
                    </div>

                    <!-- Thumb Oval Calculator -->
                    <div class="bg-gray-800 p-3 rounded border border-gray-700">
                        <span class="text-xs font-bold text-primary block mb-2 uppercase">Thumb Oval Generator</span>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="thumbStart" placeholder="Start (53/64)" class="pitch-input text-center text-xs">
                            <input type="number" id="thumbOval" placeholder="Deg (60)" class="pitch-input text-center text-xs">
                            <input type="text" id="thumbEnd" placeholder="End (61/64)" class="pitch-input text-center text-xs">
                        </div>
                        <button type="button" onclick="generateCuts()" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 rounded transition">GENERATE CUTS</button>
                        <div id="cutsOutput" class="mt-3 text-sm text-primary font-mono space-y-1 text-center bg-black rounded py-2 hidden border border-gray-700"></div>
                    </div>
                </div>

                <!-- Hard Copy Photo Upload -->
                <div>
                    <label class="block text-xs text-gray-400 mt-3 mb-1">Physical Spec Sheet Photo (Optional)</label>
                    <input type="file" accept="image/*" onchange="handleFile(event, 'drillPhoto')" class="text-sm text-gray-400 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-800 file:text-white w-full">
                    <input type="hidden" id="drillPhotoData">
                    <img id="drillPhotoPreview" class="hidden mt-2 max-h-40 rounded border border-gray-700 w-full object-contain bg-gray-900">
                </div>
            </div>

            <!-- Arsenal -->
            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-2">
                <label class="block text-xs font-bold text-primary uppercase mb-2">Arsenal (9 Balls Max)</label>
                <div id="arsenalContainer" class="space-y-3"></div>
            </div>

            <!-- Video -->
            <div class="bg-card p-4 rounded-lg border border-gray-800">
                <label class="block text-xs font-bold text-primary uppercase mb-1">Release Video</label>
                <input type="file" accept="video/*" onchange="handleFile(event, 'video')" class="text-sm text-gray-400 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-800 file:text-white w-full">
                <input type="hidden" id="videoData">
                <video id="videoPreview" controls class="hidden mt-3 w-full rounded border border-gray-700 bg-black max-h-48"></video>
            </div>

            <div class="pt-4 flex gap-3 pb-8">
                <button type="submit" class="flex-1 bg-primary text-dark font-bold py-3 rounded-lg shadow">SAVE PROFILE</button>
                <button type="button" id="deleteBtn" onclick="deleteProfile()" class="hidden bg-red-900/50 text-red-400 font-bold px-4 py-3 rounded-lg border border-red-900">DELETE</button>
            </div>
        </form>
    </div>

    <script>
        const manifest = {
            name: "BSV Pro",
            short_name: "BSV Pro",
            display: "standalone",
            background_color: "#0B0F19",
            theme_color: "#0B0F19",
            start_url: location.href,
            icons: [{"src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎳</text></svg>", "sizes": "192x192", "type": "image/svg+xml"}]
        };
        document.getElementById('manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));

        if ('serviceWorker' in navigator) {
            const sw = `self.addEventListener('fetch', () => {}); self.addEventListener('install', e => self.skipWaiting());`;
            const blob = new Blob([sw], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }

        const finishes = ['500','500P','1000','1000P','1500','1500P','2000','2000P','3000','3000P','4000','4000P'];
        const arsenalDiv = document.getElementById('arsenalContainer');
        for(let i=0; i<9; i++) {
            arsenalDiv.innerHTML += `
                <div class="flex gap-2 items-center bg-gray-900 p-2 rounded border border-gray-800">
                    <span class="text-xs text-gray-500 font-bold w-4">${i+1}</span>
                    <input type="text" id="ball_name_${i}" placeholder="Brand/Name" class="flex-1 bg-transparent border-b border-gray-700 text-sm text-white focus:border-primary outline-none py-1">
                    <input type="text" id="ball_layout_${i}" placeholder="Layout" class="w-1/4 bg-transparent border-b border-gray-700 text-sm text-white focus:border-primary outline-none py-1">
                    <select id="ball_finish_${i}" class="bg-gray-800 border border-gray-700 rounded text-[10px] text-white p-1">
                        <option value="">Finish</option>
                        ${finishes.map(f => `<option value="${f}">${f}</option>`).join('')}
                    </select>
                </div>
            `;
        }

        let db;
        const request = indexedDB.open("BSVProShopDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("bowlers")) db.createObjectStore("bowlers", { keyPath: "id" });
        };
        request.onsuccess = (e) => { db = e.target.result; loadList(); };

        // Parsing and Math Utils
        function parseFraction(str) {
            str = str.trim();
            if(str.includes('/')) {
                let parts = str.split('/');
                return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            if(str.includes(' ')) {
                let parts = str.split(' ');
                let fParts = parts[1].split('/');
                return parseFloat(parts[0]) + (parseFloat(fParts[0]) / parseFloat(fParts[1]));
            }
            return parseFloat(str) || 0;
        }

        function decimalToFraction(dec) {
            if (dec === 0) return "0";
            let absDec = Math.abs(dec);
            let whole = Math.floor(absDec);
            let fraction = absDec - whole;
            let sixteenths = Math.round(fraction * 16);

            if (sixteenths === 16) { whole += 1; sixteenths = 0; }
            if (whole === 0 && sixteenths === 0) return "0";

            let fracStr = "";
            if (sixteenths > 0) {
                let num = sixteenths; let den = 16;
                while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
                fracStr = num + "/" + den;
            }
            if (whole > 0 && fracStr !== "") return whole + " " + fracStr;
            if (whole > 0) return whole.toString();
            return fracStr;
        }

        // Auto Pitch Suggestion (Spectre Logic)
        function suggestThumbPitch() {
            let leftSpanStr = document.getElementById('spanLeft').value;
            let rightSpanStr = document.getElementById('spanRight').value;
            if (!leftSpanStr && !rightSpanStr) {
                alert("Please enter a span first.");
                return;
            }
            
            let leftSpan = parseFraction(leftSpanStr);
            let rightSpan = parseFraction(rightSpanStr);
            let avgSpan = 0;
            if (leftSpan > 0 && rightSpan > 0) avgSpan = (leftSpan + rightSpan) / 2;
            else avgSpan = leftSpan > 0 ? leftSpan : rightSpan;

            // Algorithm derived from Spectre PRO column: Pitch = (4.5 - Span) / 2
            let basePitch = (4.5 - avgSpan) / 2;
            
            let thumbSize = document.getElementById('thumbSize').value;
            let adj = 0;
            if (thumbSize === 'small') adj = 0.125;   // +1/8 Forward
            if (thumbSize === 'large') adj = -0.125;  // +1/8 Reverse

            let totalPitch = basePitch + adj;
            let dir = totalPitch < 0 ? "↓" : "↑";
            
            document.getElementById('thP1').value = decimalToFraction(Math.abs(totalPitch));
            document.getElementById('thD1').value = dir;
        }

        // Oval Calculator
        function generateCuts() {
            let startStr = document.getElementById('thumbStart').value;
            let endStr = document.getElementById('thumbEnd').value;
            let angle = parseFloat(document.getElementById('thumbOval').value);

            if(!startStr || !endStr || isNaN(angle)) return;

            let diff = parseFraction(endStr) - parseFraction(startStr);
            if(diff <= 0) { alert("End size must be larger than start size"); return; }

            let rad = angle * Math.PI / 180;
            let xTotal = diff * Math.cos(rad);
            let yTotal = diff * Math.sin(rad);
            let steps = Math.ceil(Math.max(xTotal, yTotal) / 0.030);
            if (steps < 1) steps = 1;

            let cutsDiv = document.getElementById('cutsOutput');
            let html = '';
            for(let i = 1; i <= steps; i++) {
                let currentX = (xTotal / steps * i).toFixed(3).replace(/^0+/, '');
                let currentY = (yTotal / steps * i).toFixed(3).replace(/^0+/, '');
                html += `<div>Step ${i}: ${currentX} / ${currentY}</div>`;
            }
            cutsDiv.innerHTML = html;
            cutsDiv.classList.remove('hidden');
        }

        // UI Interactions
        function toggleThumbSections() {
            const style = document.getElementById('bowlerStyle').value;
            const spanSec = document.getElementById('spanSection');
            const thumbSec = document.getElementById('thumbFeaturesSection');
            
            if (style === 'no_thumb') {
                spanSec.classList.add('hidden');
                thumbSec.classList.add('hidden');
            } else {
                spanSec.classList.remove('hidden');
                thumbSec.classList.remove('hidden');
            }
        }

        function handleFile(e, targetId) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const b64 = event.target.result;
                if(targetId === 'profile') {
                    document.getElementById('profilePhotoData').value = b64;
                    document.getElementById('profilePreview').src = b64;
                    document.getElementById('profilePreview').classList.remove('hidden');
                    document.getElementById('profileIcon').classList.add('hidden');
                } else if(targetId === 'drillPhoto') {
                    document.getElementById('drillPhotoData').value = b64;
                    document.getElementById('drillPhotoPreview').src = b64;
                    document.getElementById('drillPhotoPreview').classList.remove('hidden');
                } else if(targetId === 'video') {
                    document.getElementById('videoData').value = b64;
                    document.getElementById('videoPreview').src = b64;
                    document.getElementById('videoPreview').classList.remove('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        // Load & Save
        function loadList() {
            const tx = db.transaction("bowlers", "readonly");
            const req = tx.objectStore("bowlers").getAll();
            req.onsuccess = () => {
                const bowlers = req.result;
                const list = document.getElementById('bowlerList');
                const empty = document.getElementById('emptyState');
                if(bowlers.length === 0) {
                    list.innerHTML = '';
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    list.innerHTML = bowlers.map(b => {
                        let profImg = b.profilePhoto ? `<img src="${b.profilePhoto}" class="w-12 h-12 rounded-full object-cover border border-gray-700">` : `<div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xl">👤</div>`;
                        let styleBadge = b.style === 'no_thumb' ? '2-Handed' : (b.style === 'left' ? 'Left' : 'Right');
                        return `
                        <div onclick="openForm('${b.id}')" class="bg-card p-3 rounded-xl border border-gray-700 shadow flex justify-between items-center cursor-pointer active:scale-95 transition-transform">
                            <div class="flex items-center gap-3">
                                ${profImg}
                                <div>
                                    <h3 class="font-bold text-white text-lg">${b.name} <span class="text-[10px] bg-primary text-dark px-1.5 py-0.5 rounded ml-1 uppercase font-bold">${styleBadge}</span></h3>
                                    <div class="text-xs text-gray-400 mt-0.5 flex gap-2">
                                        <span>Avg: <strong class="text-gray-200">${b.avg || '-'}</strong></span>
                                        <span>Spd: <strong class="text-gray-200">${b.speed ? b.speed+'mph' : '-'}</strong></span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-primary font-bold">›</div>
                        </div>
                    `}).join('');
                }
            };
        }

        function openForm(id = null) {
            document.getElementById('bowlerForm').reset();
            ['profilePreview', 'drillPhotoPreview', 'videoPreview', 'cutsOutput'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('profileIcon').classList.remove('hidden');
            ['profilePhotoData', 'drillPhotoData', 'videoData'].forEach(id => document.getElementById(id).value = '');
            
            if (id) {
                document.getElementById('formTitle').innerText = "Edit Profile";
                document.getElementById('deleteBtn').classList.remove('hidden');
                
                db.transaction("bowlers", "readonly").objectStore("bowlers").get(id).onsuccess = (e) => {
                    const b = e.target.result;
                    document.getElementById('bowlerId').value = b.id;
                    document.getElementById('bName').value = b.name || '';
                    document.getElementById('bowlerStyle').value = b.style || 'right';
                    
                    document.getElementById('papX').value = b.papX || '';
                    document.getElementById('papXDir').value = b.papXDir || '→';
                    document.getElementById('papY').value = b.papY || '';
                    document.getElementById('papYDir').value = b.papYDir || '↑';
                    
                    document.getElementById('statRevs').value = b.revs || '';
                    document.getElementById('statAvg').value = b.avg || '';
                    document.getElementById('statSpeed').value = b.speed || '';
                    
                    document.getElementById('spanLeft').value = b.spanLeft || '';
                    document.getElementById('spanRight').value = b.spanRight || '';
                    document.getElementById('thumbSize').value = b.thumbSize || 'normal';
                    
                    document.getElementById('lfP1').value = b.lfP1 || ''; document.getElementById('lfD1').value = b.lfD1 || '↑';
                    document.getElementById('lfP2').value = b.lfP2 || ''; document.getElementById('lfD2').value = b.lfD2 || '←';
                    document.getElementById('rfP1').value = b.rfP1 || ''; document.getElementById('rfD1').value = b.rfD1 || '↑';
                    document.getElementById('rfP2').value = b.rfP2 || ''; document.getElementById('rfD2').value = b.rfD2 || '←';
                    document.getElementById('thP1').value = b.thP1 || ''; document.getElementById('thD1').value = b.thD1 || '↑';
                    document.getElementById('thP2').value = b.thP2 || ''; document.getElementById('thD2').value = b.thD2 || '←';
                    
                    document.getElementById('thumbStart').value = b.thumbStart || '';
                    document.getElementById('thumbOval').value = b.thumbOval || '';
                    document.getElementById('thumbEnd').value = b.thumbEnd || '';

                    if(b.cutsOutput) { document.getElementById('cutsOutput').innerHTML = b.cutsOutput; document.getElementById('cutsOutput').classList.remove('hidden'); }
                    if(b.profilePhoto) { document.getElementById('profilePhotoData').value = b.profilePhoto; document.getElementById('profilePreview').src = b.profilePhoto; document.getElementById('profilePreview').classList.remove('hidden'); document.getElementById('profileIcon').classList.add('hidden'); }
                    if(b.photo) { document.getElementById('drillPhotoData').value = b.photo; document.getElementById('drillPhotoPreview').src = b.photo; document.getElementById('drillPhotoPreview').classList.remove('hidden'); }
                    if(b.video) { document.getElementById('videoData').value = b.video; document.getElementById('videoPreview').src = b.video; document.getElementById('videoPreview').classList.remove('hidden'); }

                    if(b.arsenal) {
                        b.arsenal.forEach((ball, i) => {
                            document.getElementById(`ball_name_${i}`).value = ball.name;
                            document.getElementById(`ball_layout_${i}`).value = ball.layout;
                            document.getElementById(`ball_finish_${i}`).value = ball.finish;
                        });
                    }
                    toggleThumbSections();
                };
            } else {
                document.getElementById('formTitle').innerText = "New Bowler";
                document.getElementById('bowlerId').value = Date.now().toString();
                document.getElementById('deleteBtn').classList.add('hidden');
                toggleThumbSections();
            }
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeForm() {
            document.getElementById('formModal').classList.add('hidden');
            document.getElementById('videoPreview').pause(); 
        }

        function saveBowler(e) {
            e.preventDefault();
            const id = document.getElementById('bowlerId').value;
            let arsenal = [];
            for(let i=0; i<9; i++) {
                arsenal.push({
                    name: document.getElementById(`ball_name_${i}`).value,
                    layout: document.getElementById(`ball_layout_${i}`).value,
                    finish: document.getElementById(`ball_finish_${i}`).value
                });
            }

            const bowler = {
                id: id,
                name: document.getElementById('bName').value,
                style: document.getElementById('bowlerStyle').value,
                
                papX: document.getElementById('papX').value, papXDir: document.getElementById('papXDir').value,
                papY: document.getElementById('papY').value, papYDir: document.getElementById('papYDir').value,
                revs: document.getElementById('statRevs').value, avg: document.getElementById('statAvg').value, speed: document.getElementById('statSpeed').value,
                
                spanLeft: document.getElementById('spanLeft').value, spanRight: document.getElementById('spanRight').value, thumbSize: document.getElementById('thumbSize').value,
                lfP1: document.getElementById('lfP1').value, lfD1: document.getElementById('lfD1').value, lfP2: document.getElementById('lfP2').value, lfD2: document.getElementById('lfD2').value,
                rfP1: document.getElementById('rfP1').value, rfD1: document.getElementById('rfD1').value, rfP2: document.getElementById('rfP2').value, rfD2: document.getElementById('rfD2').value,
                thP1: document.getElementById('thP1').value, thD1: document.getElementById('thD1').value, thP2: document.getElementById('thP2').value, thD2: document.getElementById('thD2').value,
                
                thumbStart: document.getElementById('thumbStart').value, thumbOval: document.getElementById('thumbOval').value, thumbEnd: document.getElementById('thumbEnd').value, cutsOutput: document.getElementById('cutsOutput').innerHTML,

                profilePhoto: document.getElementById('profilePhotoData').value,
                photo: document.getElementById('drillPhotoData').value,
                video: document.getElementById('videoData').value,
                arsenal: arsenal
            };

            const tx = db.transaction("bowlers", "readwrite");
            tx.objectStore("bowlers").put(bowler);
            tx.oncomplete = () => { closeForm(); loadList(); };
        }

        function deleteProfile() {
            if(confirm("Delete this bowler profile?")) {
                const tx = db.transaction("bowlers", "readwrite");
                tx.objectStore("bowlers").delete(document.getElementById('bowlerId').value);
                tx.oncomplete = () => { closeForm(); loadList(); };
            }
        }
    </script>
</body>
</html>
