<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSV Pro - Under Construction</title>
    
    <meta name="theme-color" content="#0B0F19">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F19',
                        primary: '#38BDF8', 
                        primaryHover: '#2563EB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-gray-200 font-sans antialiased h-screen w-full flex flex-col items-center justify-center p-6 text-center">

    <!-- Logo Container with Pulse Animation -->
    <div class="animate-pulse mb-8">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 350 120" class="h-24 w-auto md:h-32">
            <defs>
                <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38BDF8" />
                    <stop offset="100%" stop-color="#2563EB" />
                </linearGradient>
            </defs>
            <!-- Core Sphere -->
            <circle cx="60" cy="60" r="50" fill="none" stroke="#1E293B" stroke-width="3"/>
            <path d="M 35 40 C 50 35 65 42 60 55 C 55 68 35 65 35 80 C 35 90 50 90 60 85" fill="none" stroke="url(#cobaltGrad)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 60 40 L 75 85 L 90 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Drill Holes -->
            <circle cx="45" cy="30" r="4.5" fill="#38BDF8" />
            <circle cx="62" cy="25" r="4.5" fill="#38BDF8" />
            <circle cx="50" cy="50" r="5.5" fill="#38BDF8" />
            
            <!-- Typography -->
            <text x="130" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">BSV</text>
            <rect x="235" y="46" width="60" height="34" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <text x="246" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#38BDF8">PRO</text>
            <text x="132" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#64748B">BOWLER SPECS VAULT</text>
        </svg>
    </div>

    <!-- Status Text -->
    <h1 class="text-3xl md:text-4xl font-black text-white mb-4 tracking-wide">
        System Updating
    </h1>
    
    <div class="space-y-2">
        <p class="text-lg text-primary font-semibold">
            Under construction. Please stand by.
        </p>
        <p class="text-md text-gray-400">
            Actualizando sistema. Por favor, espera.
        </p>
    </div>

    <!-- Loading Spinner Indicator -->
    <div class="mt-12 flex items-center justify-center gap-2">
        <div class="w-2.5 h-2.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0s;"></div>
        <div class="w-2.5 h-2.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        <div class="w-2.5 h-2.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
    </div>

</body>
</html>
