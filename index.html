<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BSV Pro - Bowler Specs Vault</title>
    
    <meta name="theme-color" content="#0B0F19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" id="manifest">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0B0F19',
                        card: '#1E293B',
                        primary: '#38BDF8', 
                        primaryHover: '#2563EB'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        .pitch-input { width: 100%; background-color: #111827; border: 1px solid #374151; border-radius: 4px; padding: 8px; color: white; font-size: 0.875rem; outline: none; }
        .pitch-input:focus { border-color: #38BDF8; }
        .dir-select { background-color: #1f2937; color: white; border: 1px solid #374151; border-radius: 4px; padding: 8px; font-size: 0.875rem; outline: none; }
        .dir-select:focus { border-color: #38BDF8; }
    </style>
</head>
<body class="bg-dark text-gray-200 font-sans antialiased pb-20 overflow-x-hidden">

    <!-- Language Selection Overlay -->
    <div id="languageOverlay" class="fixed inset-0 bg-dark z-50 flex flex-col items-center justify-center p-6">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 350 120" class="h-16 w-auto mb-8">
            <defs>
                <linearGradient id="cobaltGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38BDF8" />
                    <stop offset="100%" stop-color="#2563EB" />
                </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#1E293B" stroke-width="3"/>
            <path d="M 35 40 C 50 35 65 42 60 55 C 55 68 35 65 35 80 C 35 90 50 90 60 85" fill="none" stroke="url(#cobaltGrad2)" stroke-width="6" stroke-linecap="round"/>
            <path d="M 60 40 L 75 85 L 90 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="45" cy="30" r="4.5" fill="#38BDF8" />
            <circle cx="62" cy="25" r="4.5" fill="#38BDF8" />
            <circle cx="50" cy="50" r="5.5" fill="#38BDF8" />
            
            <text x="130" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">BSV</text>
            <rect x="235" y="46" width="60" height="34" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
            <text x="246" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#38BDF8">PRO</text>
        </svg>
        <h1 class="text-2xl font-black text-white mb-6 tracking-wide text-center">Select Language<br><span class="text-lg text-gray-400">Selecciona el Idioma</span></h1>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button onclick="setLanguage('en')" class="bg-primary hover:bg-primaryHover text-dark font-bold py-4 rounded-xl text-lg transition shadow-lg">English</button>
            <button onclick="setLanguage('es')" class="bg-card border border-gray-700 hover:border-primary text-white font-bold py-4 rounded-xl text-lg transition shadow-lg">Español (México)</button>
        </div>
    </div>

    <!-- Main App Structure -->
    <div id="appContainer" class="hidden">
        <header class="bg-card border-b border-gray-800 sticky top-0 z-30 px-4 py-3 shadow-lg flex justify-between items-center relative">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 350 120" class="h-10 w-auto">
                <circle cx="60" cy="60" r="50" fill="none" stroke="#1E293B" stroke-width="3"/>
                <path d="M 35 40 C 50 35 65 42 60 55 C 55 68 35 65 35 80 C 35 90 50 90 60 85" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
                <path d="M 60 40 L 75 85 L 90 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="45" cy="30" r="4.5" fill="#38BDF8" />
                <circle cx="62" cy="25" r="4.5" fill="#38BDF8" />
                <circle cx="50" cy="50" r="5.5" fill="#38BDF8" />
                <text x="130" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">BSV</text>
                <rect x="235" y="46" width="60" height="34" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
                <text x="246" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#38BDF8">PRO</text>
                <text x="132" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#64748B" id="txtHeaderVault">BOWLER SPECS VAULT</text>
            </svg>
            <div class="flex items-center gap-2">
                <button onclick="toggleMenu()" class="text-gray-300 hover:text-white px-2 py-1.5 rounded text-2xl transition">⋮</button>
                <button onclick="openForm()" class="bg-primary hover:bg-primaryHover text-white px-3 py-1.5 rounded text-sm font-bold shadow-md transition" id="btnNew">+ NEW</button>
            </div>
            
            <!-- Dropdown Menu -->
            <div id="mainMenu" class="absolute top-16 right-4 bg-gray-900 border border-gray-700 rounded-lg shadow-2xl hidden flex-col w-56 overflow-hidden z-40">
                <button onclick="toggleSearch()" id="btnMenuSearch" class="text-left px-4 py-3 text-sm font-bold text-white hover:bg-gray-800 border-b border-gray-800">🔍 Search Bowlers</button>
                <button onclick="exportBackup()" id="btnMenuExport" class="text-left px-4 py-3 text-sm font-bold text-white hover:bg-gray-800 border-b border-gray-800">💾 Backup & Export</button>
                <button onclick="document.getElementById('importInput').click(); toggleMenu();" id="btnMenuImport" class="text-left px-4 py-3 text-sm font-bold text-white hover:bg-gray-800 border-b border-gray-800">📂 Upload Backup</button>
                <button onclick="showLanguageScreen()" id="btnMenuLang" class="text-left px-4 py-3 text-sm font-bold text-white hover:bg-gray-800">🌐 Change Language</button>
            </div>
            <input type="file" id="importInput" accept=".json" class="hidden" onchange="importBackup(event)">
        </header>

        <main class="p-4 w-full max-w-lg mx-auto">
            <div id="searchContainer" class="hidden mb-4">
                <input type="text" id="searchInput" onkeyup="filterBowlers()" class="pitch-input w-full text-lg" placeholder="Search...">
            </div>
            <div id="bowlerList" class="space-y-3"></div>
            <div id="emptyState" class="hidden flex flex-col items-center justify-center mt-20 text-center opacity-50">
                <svg class="w-16 h-16 mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <p id="txtEmpty">No bowlers found.<br>Tap + NEW to create a profile.</p>
            </div>
        </main>
    </div>

    <!-- Bowler Form / Detail Modal -->
    <div id="formModal" class="fixed inset-0 bg-dark z-50 hidden overflow-y-auto w-full max-w-lg mx-auto">
        <div class="sticky top-0 bg-card border-b border-gray-800 px-4 py-4 flex justify-between items-center z-10">
            <h2 id="formTitle" class="text-lg font-bold text-white">Bowler Profile</h2>
            <button onclick="closeForm()" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
        </div>

        <form id="bowlerForm" onsubmit="saveBowler(event)" class="p-4 space-y-5">
            <input type="hidden" id="bowlerId">

            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-4">
                <div class="flex items-center gap-4">
                    <div class="relative w-16 h-16 rounded-full bg-gray-900 border border-gray-700 flex items-center justify-center overflow-hidden shrink-0 cursor-pointer" onclick="document.getElementById('profilePhotoInput').click()">
                        <img id="profilePreview" class="w-full h-full object-cover hidden">
                        <span id="profileIcon" class="text-2xl text-gray-500">📷</span>
                    </div>
                    <input type="file" id="profilePhotoInput" accept="image/*" class="hidden" onchange="handleFile(event, 'profile')">
                    <input type="hidden" id="profilePhotoData">
                    
                    <div class="flex-1">
                        <label id="lblBowlerName" class="block text-xs font-bold text-primary mb-1 uppercase">Bowler Name</label>
                        <input type="text" id="bName" required class="pitch-input text-lg font-bold">
                    </div>
                </div>

                <div>
                    <label id="lblBowlingStyle" class="block text-xs font-bold text-primary mb-1 uppercase">Bowling Style</label>
                    <select id="bowlerStyle" class="pitch-input font-semibold text-primary" onchange="toggleThumbSections()">
                        <option id="optStyleRight" value="right">Right Handed (1-Hand)</option>
                        <option id="optStyleLeft" value="left">Left Handed (1-Hand)</option>
                        <option id="optStyleNoThumb" value="no_thumb">No Thumb (2-Handed)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-card p-3 rounded-lg border border-gray-800">
                    <label class="block text-xs font-bold text-primary mb-2 uppercase">PAP</label>
                    <div class="flex gap-1 mb-2">
                        <input type="text" id="papX" class="pitch-input" placeholder="Dist">
                        <select id="papXDir" class="dir-select px-1"><option value="→" id="optPapRight">→ R</option><option value="←" id="optPapLeft">← L</option></select>
                    </div>
                    <div class="flex gap-1">
                        <input type="text" id="papY" class="pitch-input" placeholder="Dist">
                        <select id="papYDir" class="dir-select px-1"><option value="↑" id="optPapUp">↑ Up</option><option value="↓" id="optPapDown">↓ Dn</option></select>
                    </div>
                </div>
                
                <div class="bg-card p-3 rounded-lg border border-gray-800">
                    <label id="lblStats" class="block text-xs font-bold text-primary mb-2 uppercase">Stats</label>
                    <div class="grid grid-cols-1 gap-2">
                        <input type="text" id="statRevs" class="pitch-input" placeholder="Revs (RPM)">
                        <input type="number" id="statAvg" class="pitch-input" placeholder="Average">
                        <input type="number" id="statSpeed" class="pitch-input" placeholder="Speed (MPH)" step="0.1">
                    </div>
                </div>
            </div>

            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-4">
                <label id="lblDrillSheet" class="block text-xs font-bold text-primary uppercase border-b border-gray-700 pb-2">Drill Sheet / Pitches</label>
                
                <div id="spanSection" class="space-y-2 pb-2 border-b border-gray-800">
                    <span id="lblSpans" class="text-xs font-bold text-gray-400 block">Spans</span>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="spanLeft" class="pitch-input text-center text-sm font-mono"></select>
                        <select id="spanRight" class="pitch-input text-center text-sm font-mono"></select>
                    </div>
                    
                    <div class="flex gap-2 items-center bg-gray-900 p-2 rounded border border-gray-700 mt-2">
                        <select id="thumbSize" class="dir-select flex-1 text-xs">
                            <option value="normal" id="optThumbNormal">Normal Thumb</option>
                            <option value="small" id="optThumbSmall">Small Thumb (+1/8 FWD)</option>
                            <option value="large" id="optThumbLarge">Large Thumb (+1/8 REV)</option>
                        </select>
                        <button type="button" id="btnAutoPitch" onclick="suggestThumbPitch()" class="bg-primary hover:bg-primaryHover text-dark px-3 py-2 rounded text-xs font-bold transition">Auto-Pitch</button>
                    </div>
                </div>

                <div class="bg-gray-900 p-2 rounded border border-gray-700">
                    <span id="lblLeftFinger" class="text-xs font-bold text-gray-400 block mb-1">Left Finger</span>
                    <div class="flex gap-2 mb-2">
                        <select id="lfP1" class="pitch-input font-mono"></select>
                        <select id="lfD1" class="dir-select dir-y"></select>
                    </div>
                    <div class="flex gap-2">
                        <select id="lfP2" class="pitch-input font-mono"></select>
                        <select id="lfD2" class="dir-select dir-x"></select>
                    </div>
                </div>

                <div class="bg-gray-900 p-2 rounded border border-gray-700">
                    <span id="lblRightFinger" class="text-xs font-bold text-gray-400 block mb-1">Right Finger</span>
                    <div class="flex gap-2 mb-2">
                        <select id="rfP1" class="pitch-input font-mono"></select>
                        <select id="rfD1" class="dir-select dir-y"></select>
                    </div>
                    <div class="flex gap-2">
                        <select id="rfP2" class="pitch-input font-mono"></select>
                        <select id="rfD2" class="dir-select dir-x"></select>
                    </div>
                </div>

                <div id="thumbFeaturesSection" class="space-y-4">
                    <div class="bg-gray-900 p-2 rounded border border-gray-700">
                        <span id="lblThumb" class="text-xs font-bold text-primary block mb-1">Thumb</span>
                        <div class="flex gap-2 mb-2">
                            <select id="thP1" class="pitch-input font-mono border-primary"></select>
                            <select id="thD1" class="dir-select dir-y"></select>
                        </div>
                        <div class="flex gap-2">
                            <select id="thP2" class="pitch-input font-mono border-primary"></select>
                            <select id="thD2" class="dir-select dir-x"></select>
                        </div>
                    </div>

                    <div class="bg-gray-800 p-3 rounded border border-gray-700">
                        <span id="lblThumbOval" class="text-xs font-bold text-primary block mb-2 uppercase">Thumb Oval Generator</span>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="thumbStart" placeholder="Start" class="pitch-input text-center text-xs">
                            <input type="number" id="thumbOval" placeholder="Deg" class="pitch-input text-center text-xs">
                            <input type="text" id="thumbEnd" placeholder="End" class="pitch-input text-center text-xs">
                        </div>
                        <button type="button" id="btnGenerate" onclick="generateCuts()" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold py-2 rounded transition">GENERATE CUTS</button>
                        <div id="cutsOutput" class="mt-3 text-sm text-primary font-mono space-y-1 text-center bg-black rounded py-3 hidden border border-gray-700"></div>
                    </div>
                </div>

                <div>
                    <label id="lblPhoto" class="block text-xs text-gray-400 mt-3 mb-1">Physical Spec Sheet Photo (Optional)</label>
                    <input type="file" accept="image/*" onchange="handleFile(event, 'drillPhoto')" class="text-sm text-gray-400 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-800 file:text-white w-full">
                    <input type="hidden" id="drillPhotoData">
                    <img id="drillPhotoPreview" class="hidden mt-2 max-h-40 rounded border border-gray-700 w-full object-contain bg-gray-900">
                </div>
            </div>

            <div class="bg-card p-4 rounded-lg border border-gray-800 space-y-2">
                <label id="lblArsenal" class="block text-xs font-bold text-primary uppercase mb-2">Arsenal (9 Balls Max)</label>
                <div id="arsenalContainer" class="space-y-3"></div>
            </div>

            <div class="bg-card p-4 rounded-lg border border-gray-800">
                <label id="lblVideo" class="block text-xs font-bold text-primary uppercase mb-1">Release Video</label>
                <input type="file" accept="video/*" onchange="handleFile(event, 'video')" class="text-sm text-gray-400 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-800 file:text-white w-full">
                <input type="hidden" id="videoData">
                <video id="videoPreview" controls class="hidden mt-3 w-full rounded border border-gray-700 bg-black max-h-48"></video>
            </div>

            <div class="pt-4 flex gap-3 pb-8">
                <button type="submit" id="btnSave" class="flex-1 bg-primary text-dark font-bold py-3 rounded-lg shadow">SAVE PROFILE</button>
                <button type="button" id="btnDelete" onclick="deleteProfile()" class="hidden bg-red-900/50 text-red-400 font-bold px-4 py-3 rounded-lg border border-red-900">DELETE</button>
            </div>
        </form>
    </div>

    <script>
        const appIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="24" fill="#0B0F19"/><circle cx="60" cy="60" r="50" fill="none" stroke="#1E293B" stroke-width="4"/><path d="M 35 40 C 50 35 65 42 60 55 C 55 68 35 65 35 80 C 35 90 50 90 60 85" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/><path d="M 60 40 L 75 85 L 90 40" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="45" cy="30" r="5" fill="#38BDF8" /><circle cx="62" cy="25" r="5" fill="#38BDF8" /><circle cx="50" cy="50" r="6" fill="#38BDF8" /></svg>`;

        const manifest = {
            name: "BSV Pro", short_name: "BSV Pro", display: "standalone", background_color: "#0B0F19", theme_color: "#0B0F19", start_url: location.href, 
            icons: [{"src": "data:image/svg+xml;charset=utf-8," + encodeURIComponent(appIconSvg), "sizes": "512x512", "type": "image/svg+xml", "purpose": "any maskable"}]
        };
        document.getElementById('manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));

        let currentLang = 'en';
        let allBowlers = [];

        const translations = {
            en: {
                txtHeaderVault: "BOWLER SPECS VAULT", btnNew: "+ NEW", txtEmpty: "No bowlers found.<br>Tap + NEW to create a profile.",
                formTitleNew: "New Bowler", formTitleEdit: "Edit Profile", lblBowlerName: "Bowler Name", lblBowlingStyle: "Bowling Style",
                optStyleRight: "Right Handed (1-Hand)", optStyleLeft: "Left Handed (1-Hand)", optStyleNoThumb: "No Thumb (2-Handed)",
                optPapRight: "→ R", optPapLeft: "← L", optPapUp: "↑ Up", optPapDown: "↓ Dn",
                lblStats: "Stats", statRevs: "Revs (RPM)", statAvg: "Average", statSpeed: "Speed (MPH)",
                lblDrillSheet: "Drill Sheet / Pitches", lblSpans: "Spans",
                optThumbNormal: "Normal Thumb", optThumbSmall: "Small Thumb (+1/8 FWD)", optThumbLarge: "Large Thumb (+1/8 REV)", btnAutoPitch: "Auto-Pitch",
                lblLeftFinger: "Left Finger", lblRightFinger: "Right Finger", lblThumb: "Thumb", lblThumbOval: "Thumb Oval Generator",
                btnGenerate: "GENERATE CUTS", lblPhoto: "Physical Spec Sheet Photo (Optional)", lblArsenal: "Arsenal (9 Balls Max)",
                lblVideo: "Release Video", btnSave: "SAVE PROFILE", btnDelete: "DELETE",
                alertEndSize: "End size must be larger than start size", alertSpan: "Please select a span first.", confirmDelete: "Delete this bowler profile?",
                dirYUp: "↑ Up (FWD)", dirYDown: "↓ Down (REV)", dirXLeft: "← Left", dirXRight: "→ Right",
                menuSearch: "🔍 Search Bowlers", menuExport: "💾 Backup & Export", menuImport: "📂 Upload Backup", menuLang: "🌐 Change Language", searchPh: "Search..."
            },
            es: {
                txtHeaderVault: "BÓVEDA DE MEDIDAS", btnNew: "+ NUEVO", txtEmpty: "No se encontraron jugadores.<br>Toca + NUEVO para crear un perfil.",
                formTitleNew: "Nuevo Jugador", formTitleEdit: "Editar Perfil", lblBowlerName: "Nombre del Jugador", lblBowlingStyle: "Estilo de Juego",
                optStyleRight: "Diestro (1 Mano)", optStyleLeft: "Zurdo (1 Mano)", optStyleNoThumb: "Sin Pulgar (2 Manos)",
                optPapRight: "→ Der", optPapLeft: "← Izq", optPapUp: "↑ Arr", optPapDown: "↓ Aba",
                lblStats: "Estadísticas", statRevs: "Rev (RPM)", statAvg: "Promedio", statSpeed: "Velocidad (MPH)",
                lblDrillSheet: "Perforación / Inclinaciones", lblSpans: "Distancias (Spans)",
                optThumbNormal: "Pulgar Normal", optThumbSmall: "Pulgar Pequeño (+1/8 ADE)", optThumbLarge: "Pulgar Grande (+1/8 ATR)", btnAutoPitch: "Auto-Inclinación",
                lblLeftFinger: "Dedo Izquierdo", lblRightFinger: "Dedo Derecho", lblThumb: "Pulgar", lblThumbOval: "Generador Óvalo de Pulgar",
                btnGenerate: "GENERAR CORTES", lblPhoto: "Foto de Hoja Física (Opcional)", lblArsenal: "Arsenal (Máx 9 Bolas)",
                lblVideo: "Video de Lanzamiento", btnSave: "GUARDAR PERFIL", btnDelete: "ELIMINAR",
                alertEndSize: "El tamaño final debe ser mayor al inicial", alertSpan: "Selecciona una distancia (span) primero.", confirmDelete: "¿Eliminar este perfil de jugador?",
                dirYUp: "↑ Adelante (FWD)", dirYDown: "↓ Atrás (REV)", dirXLeft: "← Izquierda", dirXRight: "→ Derecha",
                menuSearch: "🔍 Buscar Jugadores", menuExport: "💾 Respaldar y Exportar", menuImport: "📂 Subir Respaldo", menuLang: "🌐 Cambiar Idioma", searchPh: "Buscar..."
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('bsv_lang', lang);
            document.getElementById('languageOverlay').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            
            const t = translations[lang];
            ['txtHeaderVault','btnNew','txtEmpty','lblBowlerName','lblBowlingStyle','optStyleRight','optStyleLeft','optStyleNoThumb','optPapRight','optPapLeft','optPapUp','optPapDown','lblStats','lblDrillSheet','lblSpans','optThumbNormal','optThumbSmall','optThumbLarge','btnAutoPitch','lblLeftFinger','lblRightFinger','lblThumb','lblThumbOval','btnGenerate','lblPhoto','lblArsenal','lblVideo','btnSave','btnDelete'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).innerHTML = t[id];
            });
            
            document.getElementById('btnMenuSearch').innerHTML = t.menuSearch;
            document.getElementById('btnMenuExport').innerHTML = t.menuExport;
            document.getElementById('btnMenuImport').innerHTML = t.menuImport;
            document.getElementById('btnMenuLang').innerHTML = t.menuLang;
            document.getElementById('searchInput').placeholder = t.searchPh;

            document.getElementById('statRevs').placeholder = t.statRevs;
            document.getElementById('statAvg').placeholder = t.statAvg;
            document.getElementById('statSpeed').placeholder = t.statSpeed;

            document.querySelectorAll('.dir-y').forEach(el => {
                let val = el.value; el.innerHTML = `<option value="↑">${t.dirYUp}</option><option value="↓">${t.dirYDown}</option>`; el.value = val || '↑';
            });
            document.querySelectorAll('.dir-x').forEach(el => {
                let val = el.value; el.innerHTML = `<option value="←">${t.dirXLeft}</option><option value="→">${t.dirXRight}</option>`; el.value = val || '←';
            });
            
            loadList(); 
        }

        function showLanguageScreen() {
            toggleMenu();
            document.getElementById('languageOverlay').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
        }

        function toggleMenu() {
            const menu = document.getElementById('mainMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function toggleSearch() {
            toggleMenu();
            const sc = document.getElementById('searchContainer');
            sc.classList.toggle('hidden');
            if(!sc.classList.contains('hidden')) document.getElementById('searchInput').focus();
            else { document.getElementById('searchInput').value = ''; renderBowlers(allBowlers); }
        }

        function filterBowlers() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBowlers.filter(b => b.name.toLowerCase().includes(query));
            renderBowlers(filtered);
        }

        function exportBackup() {
            toggleMenu();
            const tx = db.transaction("bowlers", "readonly");
            tx.objectStore("bowlers").getAll().onsuccess = (e) => {
                const data = JSON.stringify(e.target.result);
                const blob = new Blob([data], {type: "application/json"});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `bsv_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };
        }

        function importBackup(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const bowlers = JSON.parse(event.target.result);
                    const tx = db.transaction("bowlers", "readwrite");
                    const store = tx.objectStore("bowlers");
                    bowlers.forEach(b => store.put(b));
                    tx.oncomplete = () => { alert("Backup restored successfully."); loadList(); };
                } catch (err) { alert("Invalid backup file format."); }
            };
            reader.readAsText(file);
            e.target.value = ''; 
        }

        const fractionsArr = ['','1/16','1/8','3/16','1/4','5/16','3/8','7/16','1/2','9/16','5/8','11/16','3/4','13/16','7/8','15/16'];
        
        let pitchOptions = '<option value="0">0</option>';
        for(let whole = 0; whole <= 2; whole++) {
            for(let frac of fractionsArr) {
                if(whole === 0 && frac === '') continue;
                if(whole === 2 && frac !== '') continue;
                let text = frac ? (whole ? `${whole} ${frac}` : frac) : `${whole}`;
                pitchOptions += `<option value="${text}">${text}</option>`;
            }
        }
        ['lfP1','lfP2','rfP1','rfP2','thP1','thP2'].forEach(id => document.getElementById(id).innerHTML = pitchOptions);

        let spanOptions = '<option value="">-</option>';
        for(let whole = 3; whole <= 7; whole++) {
            for(let frac of fractionsArr) {
                if(whole === 7 && frac !== '') break;
                let text = frac ? `${whole} ${frac}` : `${whole}`;
                spanOptions += `<option value="${text}">${text}</option>`;
            }
        }
        document.getElementById('spanLeft').innerHTML = spanOptions; document.getElementById('spanRight').innerHTML = spanOptions;

        const finishes = ['500','500P','1000','1000P','1500','1500P','2000','2000P','3000','3000P','4000','4000P'];
        const arsenalDiv = document.getElementById('arsenalContainer');
        for(let i=0; i<9; i++) {
            arsenalDiv.innerHTML += `
                <div class="flex gap-2 items-center bg-gray-900 p-2 rounded border border-gray-800">
                    <span class="text-xs text-gray-500 font-bold w-4">${i+1}</span>
                    <input type="text" id="ball_name_${i}" placeholder="Brand/Name" class="flex-1 bg-transparent border-b border-gray-700 text-sm text-white focus:border-primary outline-none py-1">
                    <input type="text" id="ball_layout_${i}" placeholder="Layout" class="w-1/4 bg-transparent border-b border-gray-700 text-sm text-white focus:border-primary outline-none py-1">
                    <select id="ball_finish_${i}" class="bg-gray-800 border border-gray-700 rounded text-[10px] text-white p-1">
                        <option value="">Finish</option>
                        ${finishes.map(f => `<option value="${f}">${f}</option>`).join('')}
                    </select>
                </div>
            `;
        }

        let db;
        const request = indexedDB.open("BSVProShopDB", 2);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("bowlers")) db.createObjectStore("bowlers", { keyPath: "id" });
        };
        request.onsuccess = (e) => { 
            db = e.target.result; 
            let savedLang = localStorage.getItem('bsv_lang');
            if(savedLang) { setLanguage(savedLang); }
        };

        function parseFraction(str) {
            str = str.trim();
            if(!str || str === '-') return 0;
            if(str.includes('/')) {
                if(str.includes(' ')) {
                    let parts = str.split(' '); let fParts = parts[1].split('/');
                    return parseFloat(parts[0]) + (parseFloat(fParts[0]) / parseFloat(fParts[1]));
                }
                let parts = str.split('/'); return parseFloat(parts[0]) / parseFloat(parts[1]);
            }
            return parseFloat(str) || 0;
        }

        function decimalToFractionStr(dec) {
            if (dec === 0) return "0";
            let absDec = Math.abs(dec); let whole = Math.floor(absDec); let fraction = absDec - whole;
            let sixteenths = Math.round(fraction * 16);
            if (sixteenths === 16) { whole += 1; sixteenths = 0; }
            if (whole === 0 && sixteenths === 0) return "0";
            let fracStr = "";
            if (sixteenths > 0) {
                let num = sixteenths; let den = 16;
                while (num % 2 === 0 && den % 2 === 0) { num /= 2; den /= 2; }
                fracStr = num + "/" + den;
            }
            if (whole > 0 && fracStr !== "") return whole + " " + fracStr;
            if (whole > 0) return whole.toString();
            return fracStr;
        }

        function suggestThumbPitch() {
            let leftSpanStr = document.getElementById('spanLeft').value;
            let rightSpanStr = document.getElementById('spanRight').value;
            
            if (!leftSpanStr && !rightSpanStr) {
                alert(translations[currentLang].alertSpan); return;
            }
            
            let largestSpan = Math.max(parseFraction(leftSpanStr), parseFraction(rightSpanStr));
            let basePitch = (4.5 - largestSpan) / 2;
            
            let thumbSize = document.getElementById('thumbSize').value;
            let adj = (thumbSize === 'small') ? 0.125 : ((thumbSize === 'large') ? -0.125 : 0);
            
            let totalPitch = basePitch + adj;
            let dir = totalPitch < 0 ? "↓" : "↑";
            
            document.getElementById('thP1').value = decimalToFractionStr(Math.abs(totalPitch));
            document.getElementById('thD1').value = dir;
        }

        function generateCuts() {
            let startStr = document.getElementById('thumbStart').value;
            let endStr = document.getElementById('thumbEnd').value;
            let angle = parseFloat(document.getElementById('thumbOval').value);
            let style = document.getElementById('bowlerStyle').value;

            if(!startStr || !endStr || isNaN(angle)) return;

            let diff = parseFraction(endStr) - parseFraction(startStr);
            if(diff <= 0) { alert(translations[currentLang].alertEndSize); return; }

            let baseY = parseFraction(document.getElementById('thP1').value);
            if (document.getElementById('thD1').value === '↑') baseY *= -1;

            let baseX = parseFraction(document.getElementById('thP2').value);
            if (document.getElementById('thD2').value === '→') baseX *= -1;

            let rad = angle * Math.PI / 180;
            let totalX = diff * Math.cos(rad);
            let totalY = diff * Math.sin(rad);

            let signY = 1; 
            let signX = (style === 'left') ? 1 : -1;

            let stepsCount = Math.max(1, Math.round(diff / 0.040));
            if (stepsCount < 3 && diff >= 0.100) stepsCount = 3; 

            let cutsDiv = document.getElementById('cutsOutput');
            let html = '<div class="text-xs mb-2 text-gray-400 font-sans tracking-wide">DIGITAL READING (Y / X)</div>';

            let formatNum = (num) => {
                let s = num.toFixed(3);
                if (s === '-0.000') s = '0.000';
                if(s.startsWith('0.')) return '.' + s.substring(2);
                if(s.startsWith('-0.')) return '-.' + s.substring(3);
                return s;
            };

            for(let i = 0; i <= stepsCount; i++) {
                let currentY = baseY + (totalY / stepsCount * i * signY);
                let currentX = baseX + (totalX / stepsCount * i * signX);
                html += `<div>${formatNum(currentY)} / ${formatNum(currentX)}</div>`;
            }
            
            cutsDiv.innerHTML = html;
            cutsDiv.classList.remove('hidden');
        }

        function toggleThumbSections() {
            const style = document.getElementById('bowlerStyle').value;
            const spanSec = document.getElementById('spanSection');
            const thumbSec = document.getElementById('thumbFeaturesSection');
            if (style === 'no_thumb') { spanSec.classList.add('hidden'); thumbSec.classList.add('hidden'); } 
            else { spanSec.classList.remove('hidden'); thumbSec.classList.remove('hidden'); }
        }

        function handleFile(e, targetId) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const b64 = event.target.result;
                if(targetId === 'profile') {
                    document.getElementById('profilePhotoData').value = b64;
                    document.getElementById('profilePreview').src = b64;
                    document.getElementById('profilePreview').classList.remove('hidden');
                    document.getElementById('profileIcon').classList.add('hidden');
                } else if(targetId === 'drillPhoto') {
                    document.getElementById('drillPhotoData').value = b64;
                    document.getElementById('drillPhotoPreview').src = b64;
                    document.getElementById('drillPhotoPreview').classList.remove('hidden');
                } else if(targetId === 'video') {
                    document.getElementById('videoData').value = b64;
                    document.getElementById('videoPreview').src = b64;
                    document.getElementById('videoPreview').classList.remove('hidden');
                }
            };
            reader.readAsDataURL(file);
        }

        function loadList() {
            if(!db) return;
            const tx = db.transaction("bowlers", "readonly");
            tx.objectStore("bowlers").getAll().onsuccess = (e) => {
                allBowlers = e.target.result;
                renderBowlers(allBowlers);
            };
        }

        // Swipe-to-Delete Implementation
        let touchStartX = 0;
        let touchCurrentX = 0;
        let swipingElement = null;
        let isSwiping = false;

        function handleTouchStart(e, el) {
            touchStartX = e.touches[0].clientX;
            touchCurrentX = touchStartX;
            swipingElement = el;
            el.style.transition = 'none';
            isSwiping = false;
        }

        function handleTouchMove(e) {
            if (!swipingElement) return;
            touchCurrentX = e.touches[0].clientX;
            let diff = touchCurrentX - touchStartX;
            
            if (Math.abs(diff) > 15) isSwiping = true; 
            
            if (diff < 0) {
                swipingElement.style.transform = `translateX(${Math.max(diff, -100)}px)`;
            }
        }

        function handleTouchEnd(e, id) {
            if (!swipingElement) return;
            let diff = touchCurrentX - touchStartX;
            let el = swipingElement;
            swipingElement = null;
            
            el.style.transition = 'transform 0.3s ease-out';
            if (diff < -60) {
                el.style.transform = `translateX(-100px)`;
                setTimeout(() => {
                    if(confirm(translations[currentLang].confirmDelete)) {
                        const tx = db.transaction("bowlers", "readwrite");
                        tx.objectStore("bowlers").delete(id);
                        tx.oncomplete = () => { loadList(); };
                    } else {
                        el.style.transform = `translateX(0px)`;
                        setTimeout(() => { isSwiping = false; }, 50); 
                    }
                }, 300);
            } else {
                el.style.transform = `translateX(0px)`;
                setTimeout(() => { isSwiping = false; }, 50);
            }
        }

        function renderBowlers(bowlersArray) {
            const list = document.getElementById('bowlerList');
            const empty = document.getElementById('emptyState');
            if(bowlersArray.length === 0) {
                list.innerHTML = ''; empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                list.innerHTML = bowlersArray.map(b => {
                    let profImg = b.profilePhoto ? `<img src="${b.profilePhoto}" class="w-12 h-12 rounded-full object-cover border border-gray-700">` : `<div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-xl">👤</div>`;
                    let styleBadge = b.style === 'no_thumb' ? '2H' : (b.style === 'left' ? 'LH' : 'RH');
                    return `
                    <div class="relative rounded-xl overflow-hidden mb-3 bg-red-600">
                        <div class="absolute inset-y-0 right-0 w-24 flex items-center justify-center font-bold text-white text-2xl">
                            🗑️
                        </div>
                        <div onclick="openForm('${b.id}')" 
                             ontouchstart="handleTouchStart(event, this)" 
                             ontouchmove="handleTouchMove(event)" 
                             ontouchend="handleTouchEnd(event, '${b.id}')"
                             class="relative bg-card p-3 rounded-xl border border-gray-700 shadow flex justify-between items-center cursor-pointer z-10 w-full active:scale-[0.98] transition-transform">
                            <div class="flex items-center gap-3 pointer-events-none">
                                ${profImg}
                                <div>
                                    <h3 class="font-bold text-white text-lg">${b.name} <span class="text-[10px] bg-primary text-dark px-1.5 py-0.5 rounded ml-1 font-bold">${styleBadge}</span></h3>
                                    <div class="text-xs text-gray-400 mt-0.5 flex gap-2">
                                        <span>Avg: <strong class="text-gray-200">${b.avg || '-'}</strong></span>
                                        <span>Spd: <strong class="text-gray-200">${b.speed ? b.speed : '-'}</strong></span>
                                    </div>
                                </div>
                            </div>
                            <div class="text-primary font-bold pointer-events-none">›</div>
                        </div>
                    </div>
                `}).join('');
            }
        }

        function openForm(id = null) {
            if (isSwiping && id) {
                isSwiping = false; 
                return;
            }

            document.getElementById('bowlerForm').reset();
            ['profilePreview', 'drillPhotoPreview', 'videoPreview', 'cutsOutput'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('profileIcon').classList.remove('hidden');
            ['profilePhotoData', 'drillPhotoData', 'videoData'].forEach(id => document.getElementById(id).value = '');
            
            let t = translations[currentLang];
            
            if (id) {
                document.getElementById('formTitle').innerText = t.formTitleEdit;
                document.getElementById('btnDelete').classList.remove('hidden');
                
                db.transaction("bowlers", "readonly").objectStore("bowlers").get(id).onsuccess = (e) => {
                    const b = e.target.result;
                    document.getElementById('bowlerId').value = b.id;
                    document.getElementById('bName').value = b.name || '';
                    document.getElementById('bowlerStyle').value = b.style || 'right';
                    
                    document.getElementById('papX').value = b.papX || ''; document.getElementById('papXDir').value = b.papXDir || '→';
                    document.getElementById('papY').value = b.papY || ''; document.getElementById('papYDir').value = b.papYDir || '↑';
                    
                    document.getElementById('statRevs').value = b.revs || ''; document.getElementById('statAvg').value = b.avg || ''; document.getElementById('statSpeed').value = b.speed || '';
                    document.getElementById('spanLeft').value = b.spanLeft || ''; document.getElementById('spanRight').value = b.spanRight || ''; document.getElementById('thumbSize').value = b.thumbSize || 'normal';
                    
                    document.getElementById('lfP1').value = b.lfP1 || '0'; document.getElementById('lfD1').value = b.lfD1 || '↑'; document.getElementById('lfP2').value = b.lfP2 || '0'; document.getElementById('lfD2').value = b.lfD2 || '←';
                    document.getElementById('rfP1').value = b.rfP1 || '0'; document.getElementById('rfD1').value = b.rfD1 || '↑'; document.getElementById('rfP2').value = b.rfP2 || '0'; document.getElementById('rfD2').value = b.rfD2 || '←';
                    document.getElementById('thP1').value = b.thP1 || '0'; document.getElementById('thD1').value = b.thD1 || '↑'; document.getElementById('thP2').value = b.thP2 || '0'; document.getElementById('thD2').value = b.thD2 || '←';
                    
                    document.getElementById('thumbStart').value = b.thumbStart || ''; document.getElementById('thumbOval').value = b.thumbOval || ''; document.getElementById('thumbEnd').value = b.thumbEnd || '';

                    if(b.cutsOutput) { document.getElementById('cutsOutput').innerHTML = b.cutsOutput; document.getElementById('cutsOutput').classList.remove('hidden'); }
                    if(b.profilePhoto) { document.getElementById('profilePhotoData').value = b.profilePhoto; document.getElementById('profilePreview').src = b.profilePhoto; document.getElementById('profilePreview').classList.remove('hidden'); document.getElementById('profileIcon').classList.add('hidden'); }
                    if(b.photo) { document.getElementById('drillPhotoData').value = b.photo; document.getElementById('drillPhotoPreview').src = b.photo; document.getElementById('drillPhotoPreview').classList.remove('hidden'); }
                    if(b.video) { document.getElementById('videoData').value = b.video; document.getElementById('videoPreview').src = b.video; document.getElementById('videoPreview').classList.remove('hidden'); }

                    if(b.arsenal) {
                        b.arsenal.forEach((ball, i) => {
                            document.getElementById(`ball_name_${i}`).value = ball.name;
                            document.getElementById(`ball_layout_${i}`).value = ball.layout;
                            document.getElementById(`ball_finish_${i}`).value = ball.finish;
                        });
                    }
                    toggleThumbSections();
                };
            } else {
                document.getElementById('formTitle').innerText = t.formTitleNew;
                document.getElementById('bowlerId').value = Date.now().toString();
                document.getElementById('btnDelete').classList.add('hidden');
                
                ['lfP1','lfP2','rfP1','rfP2','thP1','thP2'].forEach(id => document.getElementById(id).value = '0');
                toggleThumbSections();
            }
            document.getElementById('formModal').classList.remove('hidden');
        }

        function closeForm() {
            document.getElementById('formModal').classList.add('hidden');
            document.getElementById('videoPreview').pause(); 
        }

        function saveBowler(e) {
            e.preventDefault();
            let arsenal = [];
            for(let i=0; i<9; i++) {
                arsenal.push({ name: document.getElementById(`ball_name_${i}`).value, layout: document.getElementById(`ball_layout_${i}`).value, finish: document.getElementById(`ball_finish_${i}`).value });
            }
            const bowler = {
                id: document.getElementById('bowlerId').value, name: document.getElementById('bName').value, style: document.getElementById('bowlerStyle').value,
                papX: document.getElementById('papX').value, papXDir: document.getElementById('papXDir').value, papY: document.getElementById('papY').value, papYDir: document.getElementById('papYDir').value,
                revs: document.getElementById('statRevs').value, avg: document.getElementById('statAvg').value, speed: document.getElementById('statSpeed').value,
                spanLeft: document.getElementById('spanLeft').value, spanRight: document.getElementById('spanRight').value, thumbSize: document.getElementById('thumbSize').value,
                lfP1: document.getElementById('lfP1').value, lfD1: document.getElementById('lfD1').value, lfP2: document.getElementById('lfP2').value, lfD2: document.getElementById('lfD2').value,
                rfP1: document.getElementById('rfP1').value, rfD1: document.getElementById('rfD1').value, rfP2: document.getElementById('rfP2').value, rfD2: document.getElementById('rfD2').value,
                thP1: document.getElementById('thP1').value, thD1: document.getElementById('thD1').value, thP2: document.getElementById('thP2').value, thD2: document.getElementById('thD2').value,
                thumbStart: document.getElementById('thumbStart').value, thumbOval: document.getElementById('thumbOval').value, thumbEnd: document.getElementById('thumbEnd').value, cutsOutput: document.getElementById('cutsOutput').innerHTML,
                profilePhoto: document.getElementById('profilePhotoData').value, photo: document.getElementById('drillPhotoData').value, video: document.getElementById('videoData').value, arsenal: arsenal
            };
            const tx = db.transaction("bowlers", "readwrite"); tx.objectStore("bowlers").put(bowler); tx.oncomplete = () => { closeForm(); loadList(); };
        }

        function deleteProfile() {
            if(confirm(translations[currentLang].confirmDelete)) {
                const tx = db.transaction("bowlers", "readwrite");
                tx.objectStore("bowlers").delete(document.getElementById('bowlerId').value);
                tx.oncomplete = () => { closeForm(); loadList(); };
            }
        }
    </script>
